_target_: src.fewshot.classifier_refine.ClassifierHEC_V_refine

input_mode: cls

k: 20
tau: 10
cov_reg: 1
ensemble_method: mean_prob

# ---- Module B: Feature Refinement (defaults reproduce the baseline) ----
fisher_ratio: 1.0   # 1.0 = off; 0.75 / 0.5 / 0.25 = keep top Fisher dims per selected head
power_p: 1.0        # 1.0 = off; 0.5 = PT-MAP paper setting (signed power before L2 norm)
mask_renorm: true   # renormalize the kept subspace after masking (APE-style)

# If you want to sweep heads
# sweep_cfg:
#   k:
#     - 3
#     - 5
#     - 8
#     - 12
#     - 20
